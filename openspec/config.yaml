schema: spec-driven

context: |
  Escribe todos los artefactos en castellano. Las palabras clave RFC 2119
  (MUST, MUST NOT; no uses SHALL) y las de escenario (GIVEN, WHEN, THEN, AND) van en inglés.
  Un change corresponde a una historia de usuario. El PRD y el alcance viven en
  docs/prd/ y las historias en docs/backlog/: se enlazan, no se reescriben.

rules:
  proposal:
    - Solo decisiones de producto y el porqué, lo más breve posible. Los casos límite van a los escenarios de las specs.
    - No añadas requisitos para protegerte del mal uso de la herramienta.
    - Si el change sale de una historia de docs/backlog/, enlázala.
  specs:
    - Solo comportamiento observable desde fuera. En la API, la petición y la respuesta (estado HTTP y cuerpo). En el frontend, lo que una persona ve y puede hacer. Ni nombres de clases, ni de archivos, ni rutas de código.
    - Cuando el escenario tiene precondición, escríbela como GIVEN antes del WHEN.
    - Los escenarios que redacta el agente al proponer el change son un borrador hasta que la persona revisa el change. Una vez revisado, ningún escenario nuevo entra en la spec (en apply, update o sync) sin que la persona lo apruebe: el agente MUST NOT añadirlo por su cuenta, aunque sea un caso límite evidente.
  design:
    - Si una decisión técnica es transversal (afecta a más de un change o a las dos capas), crea un ADR en docs/adr/ con el porqué, enlázalo desde design.md y añade una referencia corta en CLAUDE.md.
  tasks:
    - Un grupo `##` por requisito. Dentro, una pareja de tareas. Primero los tests, con al menos un caso por escenario (verificación - fallan por el motivo esperado). Después la implementación (verificación - los tests pasan). La única excepción es el último grupo, «Cierre»: el E2E del camino feliz si el change tiene pantalla, y la auditoría de cobertura. No lleva pareja test → implementación.
    - Si los tests de un requisito no caben en una sesión (orientativamente, más de 5 escenarios), primero comprueba si el requisito mezcla varios comportamientos y, si es así, pártelo en la spec. Si es un solo comportamiento, reparte sus escenarios en varias parejas test → implementación dentro del mismo grupo.
    - Ningún escenario nuevo sin aprobación. Si al escribir los tests o el código aparece un caso que ningún escenario recoge, el agente MUST NOT añadirlo a la spec ni escribirle un test. Para y pregunta a la persona; esa tarea queda bloqueada y se puede seguir con las que no dependen de ella. Solo cuando lo apruebe entra en la spec, y después se escribe su test.
    - Cada tarea de test indica su nivel. En este proyecto, la interfaz pública es la API HTTP: su test es un test functional de Japa con la base de datos aislada mediante los hooks de testUtils.db() (comparte archivo con el servidor de desarrollo), y el de componente usa Vitest con MSW (ADR 0001).
    - La preparación técnica (por ejemplo, instalar un runner de tests en el frontend) es la primera tarea del grupo que la necesita, nunca un grupo aparte. Montar Playwright o la medición de cobertura es la primera tarea de «Cierre» del primer change que los necesite.
    - Código generado que queda fuera de la cobertura (se declara al montar la medición): backend/database/schema.ts, backend/.adonisjs/ y frontend/src/components/ui/.
