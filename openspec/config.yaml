schema: spec-driven

context: |
  Escribe todos los artefactos en castellano. Las palabras clave RFC 2119
  (MUST, MUST NOT; no uses SHALL) y las de escenario (GIVEN, WHEN, THEN, AND) van en inglés.
  Un change corresponde a una historia de usuario. El PRD y el alcance viven en
  docs/prd/ y las historias en docs/backlog/: se enlazan, no se reescriben.

rules:
  proposal:
    - Solo decisiones de producto y el porqué, lo más breve posible. Los casos límite van a los escenarios de las specs.
    - No añadas requisitos para protegerte del mal uso de la herramienta.
    - Si el change sale de una historia de docs/backlog/, enlázala.
  specs:
    - Solo comportamiento observable desde fuera. En la API, la petición y la respuesta (estado HTTP y cuerpo). En el frontend, lo que una persona ve y puede hacer. Ni nombres de clases, ni de archivos, ni rutas de código.
    - Cuando el escenario tiene precondición, escríbela como GIVEN antes del WHEN.
  design:
    - Si una decisión técnica es transversal (afecta a más de un change o a las dos capas), crea un ADR en docs/adr/ con el porqué, enlázalo desde design.md y añade una referencia corta en CLAUDE.md.
  tasks:
    - Un grupo `##` por requisito. Dentro, una pareja de tareas. Primero los tests, con al menos un caso por escenario (verificación - fallan por el motivo esperado). Después la implementación (verificación - los tests pasan).
    - Si los tests de un requisito no caben en una sesión (orientativamente, más de 5 escenarios), primero comprueba si el requisito mezcla varios comportamientos y, si es así, pártelo en la spec. Si es un solo comportamiento, reparte sus escenarios en varias parejas test → implementación dentro del mismo grupo.
    - Los casos límite son escenarios de la spec. Todo test cuelga de un escenario, o de una decisión técnica que la persona haya aceptado. Si al escribir los tests aparece una rama o un caso que ningún escenario recoge, NO inventes el escenario ni escribas su test: para y pregunta, porque decidirlo es una decisión de producto. Solo cuando la persona lo apruebe, el escenario entra en la spec y después se escribe su test.
    - Cada tarea de test indica su nivel (ver docs/adr/0002-niveles-de-test-y-cobertura.md). Endpoint con HTTP y base de datos reales, sin simularla, es la base y prueba cada criterio del backend, con la base de datos aislada mediante los hooks de testUtils.db() (comparte archivo con el servidor de desarrollo). Componente con la API simulada prueba cada criterio visual. Unitario solo si la lógica tiene demasiadas combinaciones para probarla por el endpoint, o decisiones técnicas propias como reintentos o traducción de errores.
    - Si el change tiene pantalla, el último grupo es «Cierre» y contiene un único test E2E del camino feliz de la historia, que prueba que está conectada de punta a punta y no verifica criterios. Sin pantalla, o si el change es solo una regla que el endpoint ya cubre, no hay E2E.
    - El grupo «Cierre» termina con la auditoría de cobertura: cobertura de ramas del código nuevo del change. Cada rama sin cubrir se clasifica en el PR como criterio que falta (se propone el escenario y se pregunta), código muerto o defensivo (se borra, o se excluye explicando por qué), decisión técnica propia (test unitario) o código de otra historia (se borra hasta que llegue). No hay umbral que bloquee.
    - Los servicios externos se simulan siempre.
    - La preparación técnica (por ejemplo, instalar un runner de tests en el frontend) es la primera tarea del grupo que la necesita, nunca un grupo aparte.
